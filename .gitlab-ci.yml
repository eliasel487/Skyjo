# Définition des stages
stages :
    - 🏗️build
    - 🧪tests

# Configuration des jobs

build:
    stage: 🏗️build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    script:
        - cd src/Skyjo
        - dotnet restore Skyjo-CI.slnx
        - dotnet build Skyjo-CI.slnx -c Release --no-restore
        - dotnet publish Skyjo-CI.slnx -c Release --no-restore -o $CI_PROJECT_DIR/build/release
    rules:
        - when: manual

tests:
  stage: 🧪tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd src/Skyjo
    - dotnet restore Skyjo-CI.slnx
    - dotnet test Skyjo-CI.slnx -c Release --no-restore
  needs:
    - job: build
  rules:
    - when: manual