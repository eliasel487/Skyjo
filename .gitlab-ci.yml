# Définition des stages
stages :
    - 🏗️build

# Configuration des jobs

build:
    stage: 🏗️build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    script:
        - cd src/Skyjo
        - dotnet restore Skyjo.sln
        - dotnet build Skyjo.sln -c Release --no-restore
        - dotnet publish Skyjo.sln -c Release --no-restore -o $CI_PROJECT_DIR/build/release
        - dotnet workload restore Skyjo.csproj
    rules:
        - when: manual