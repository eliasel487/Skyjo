# Définition des stages
stages :
    - 🏗️build
    - 🧪tests
    - ☢️code-analysis
    - 📦push
    - 🚀deploy

include:
  - project: 'IUT_INF63/generic-ci'
    ref: 'main'
    file:
      - 'build/.documentation-build.yml'
      - 'deploy/.docker-deploy.yml'

# Configuration des jobs

build:
    stage: 🏗️build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    script:
        - cd src/Skyjo
        - dotnet restore Skyjo-CI.slnx
        - dotnet build Skyjo-CI.slnx -c Release --no-restore
        - dotnet publish Skyjo-CI.slnx -c Release --no-restore -o $CI_PROJECT_DIR/build/release

tests:
  stage: 🧪tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd src/Skyjo
    - dotnet restore Skyjo-CI.slnx
    - dotnet test Skyjo-CI.slnx -c Release --no-restore
  needs:
    - job: build
 
sonar_analysis:
  stage: ☢️code-analysis
  image: codefirst.iut.uca.fr/macheval/codefirstimages/dotnet10:main
  variables:
    SONAR_PROJECT_KEY: EQUIPE_BERT_RABANY_TARDY_EL-MKADEMI
  script:
    - cd src/Skyjo
    - dotnet restore Skyjo-CI.slnx
    - dotnet sonarscanner begin /k:$SONAR_PROJECT_KEY /d:sonar.host.url=$SONAR_HOST /d:sonar.coverageReportPaths="coveragereport/SonarQube.xml" /d:sonar.coverage.exclusions="Tests/**" /d:sonar.login=$SONAR_TOKEN
    - dotnet build Skyjo-CI.slnx -c Release --no-restore
    - dotnet test Skyjo-CI.slnx --logger trx --no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura --collect "XPlat Code Coverage"
    - reportgenerator -reports:"**/coverage.cobertura.xml" -reporttypes:SonarQube -targetdir:"coveragereport"
    - dotnet publish Skyjo-CI.slnx -c Release --no-restore -o $CI_PROJECT_DIR/build/release
    - dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN
  needs:
    - job: build

build-doxygen-documentation:
  extends: .build-documentation
  stage: 🏗️build
  variables:
    DOXYGEN_FOLDER_PATH: Documentation/doxygen/
    DOC_TYPE: DOXYGEN
    DESTINATION_REGISTRY_IMAGE_NAME: codefirst.iut.uca.fr/iut_inf63/depotsetudiantsr2.02-03_2025-26/equipe_bert_rabany_tardy_el-mkademi
    DESTINATION_REGISTRY_IMAGE_VERSION: main
  needs:
    - job: build

push-doxygen-documentation:
  extends: .push-documentation-image
  stage: 📦push
  needs:
    - build-doxygen-documentation

deploy-my-pod:
  extends: .deploy-image
  stage: 🚀deploy
  variables:
      CONTAINER_NAME: Skyjo
      CONTAINER_IMAGE_PATH: codefirst.iut.uca.fr/iut_inf63/depotsetudiantsr2.02-03_2025-26/equipe_bert_rabany_tardy_el-mkademi:main
      NAMESPACE_NAME: iut-inf63-depotsetudiantsr2-02-03-2025-26-equipe-bert-rabany-tardy-el-mkademi
      NAMESPACE_TOKEN: $NAMESPACE_TOKEN
  needs:
    - push-doxygen-documentation